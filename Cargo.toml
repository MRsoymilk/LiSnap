[workspace]
members = ["apps/lisnap", "crates/lisnap-core", "crates/lisnap-platform", "crates/lisnap-ui"]
default-members = ["apps/lisnap"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
lisnap-core = { path = "crates/lisnap-core" }
lisnap-platform = { path = "crates/lisnap-platform" }
lisnap-ui = { path = "crates/lisnap-ui" }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
